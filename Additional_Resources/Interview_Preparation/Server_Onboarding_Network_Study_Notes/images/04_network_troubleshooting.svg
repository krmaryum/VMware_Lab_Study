<svg xmlns="http://www.w3.org/2000/svg" width="980" height="857" viewBox="0 0 980 857"><rect width="100%" height="100%" fill="#f7fafc"/><text x="490" y="52" text-anchor="middle" font-family="Arial" font-size="30" font-weight="bold" fill="#15324f">Troubleshooting: No DHCP Offer</text><rect x="155" y="80" width="670" height="69" rx="12" fill="#dcecf9" stroke="#7c9db4"/><text x="490" y="107" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#12344d">1. Physical Layer</text><text x="490" y="132" text-anchor="middle" font-family="Arial" font-size="15" fill="#345269">Check NIC link, cable, switch port</text><path d="M490 149 v24 m-8 -9 l8 9 l8 -9" fill="none" stroke="#326d9a" stroke-width="3"/><rect x="155" y="176" width="670" height="69" rx="12" fill="#e0f5ea" stroke="#7c9db4"/><text x="490" y="203" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#12344d">2. PXE NIC Selection</text><text x="490" y="228" text-anchor="middle" font-family="Arial" font-size="15" fill="#345269">Verify UEFI settings and MAC address</text><path d="M490 245 v24 m-8 -9 l8 9 l8 -9" fill="none" stroke="#326d9a" stroke-width="3"/><rect x="155" y="272" width="670" height="69" rx="12" fill="#dcecf9" stroke="#7c9db4"/><text x="490" y="299" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#12344d">3. Switch Port</text><text x="490" y="324" text-anchor="middle" font-family="Arial" font-size="15" fill="#345269">Correct port, enabled, no errors</text><path d="M490 341 v24 m-8 -9 l8 9 l8 -9" fill="none" stroke="#326d9a" stroke-width="3"/><rect x="155" y="368" width="670" height="69" rx="12" fill="#e0f5ea" stroke="#7c9db4"/><text x="490" y="395" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#12344d">4. Provisioning VLAN</text><text x="490" y="420" text-anchor="middle" font-family="Arial" font-size="15" fill="#345269">Confirm expected network membership</text><path d="M490 437 v24 m-8 -9 l8 9 l8 -9" fill="none" stroke="#326d9a" stroke-width="3"/><rect x="155" y="464" width="670" height="69" rx="12" fill="#dcecf9" stroke="#7c9db4"/><text x="490" y="491" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#12344d">5. DHCP Path</text><text x="490" y="516" text-anchor="middle" font-family="Arial" font-size="15" fill="#345269">Scope, relay, server, security policies</text><path d="M490 533 v24 m-8 -9 l8 9 l8 -9" fill="none" stroke="#326d9a" stroke-width="3"/><rect x="155" y="560" width="670" height="69" rx="12" fill="#e0f5ea" stroke="#7c9db4"/><text x="490" y="587" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#12344d">6. Evidence and Escalation</text><text x="490" y="612" text-anchor="middle" font-family="Arial" font-size="15" fill="#345269">Capture console errors, MAC, port, logs</text><path d="M490 629 v24 m-8 -9 l8 9 l8 -9" fill="none" stroke="#326d9a" stroke-width="3"/><rect x="155" y="656" width="670" height="69" rx="12" fill="#dcecf9" stroke="#7c9db4"/><text x="490" y="683" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#12344d">7. Retest and Document</text><text x="490" y="708" text-anchor="middle" font-family="Arial" font-size="15" fill="#345269">Verify IP assignment and resume provisioning</text><text x="490" y="834" text-anchor="middle" font-family="Arial" font-size="14" fill="#536a7b">Illustrative architecture — follow your approved runbook</text></svg>