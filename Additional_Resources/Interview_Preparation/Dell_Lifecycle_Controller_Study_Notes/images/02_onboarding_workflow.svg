<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="952" viewBox="0 0 1100 952"><rect width="100%" height="100%" fill="#f6f9fc"/><text x="550" y="58" text-anchor="middle" font-size="34" font-family="Arial" font-weight="bold" fill="#123047">Illustrative Server Onboarding</text><rect x="130" y="88" width="840" height="82" rx="14" fill="#e4f2ff" stroke="#aac5d8"/><text x="550" y="120" text-anchor="middle" font-size="23" font-family="Arial" font-weight="bold" fill="#173c58">1. Hardware handoff</text><text x="550" y="149" text-anchor="middle" font-size="18" font-family="Arial" fill="#36576c">Verify rack, power, cables and inventory</text><path d="M550 170 v22" stroke="#2777aa" stroke-width="3"/><rect x="130" y="192" width="840" height="82" rx="14" fill="#e6f6ed" stroke="#aac5d8"/><text x="550" y="224" text-anchor="middle" font-size="23" font-family="Arial" font-weight="bold" fill="#173c58">2. iDRAC health check</text><text x="550" y="253" text-anchor="middle" font-size="18" font-family="Arial" fill="#36576c">Review hardware health and logs</text><path d="M550 274 v22" stroke="#2777aa" stroke-width="3"/><rect x="130" y="296" width="840" height="82" rx="14" fill="#e4f2ff" stroke="#aac5d8"/><text x="550" y="328" text-anchor="middle" font-size="23" font-family="Arial" font-weight="bold" fill="#173c58">3. Lifecycle Controller</text><text x="550" y="357" text-anchor="middle" font-size="18" font-family="Arial" fill="#36576c">Open preboot management tools</text><path d="M550 378 v22" stroke="#2777aa" stroke-width="3"/><rect x="130" y="400" width="840" height="82" rx="14" fill="#e6f6ed" stroke="#aac5d8"/><text x="550" y="432" text-anchor="middle" font-size="23" font-family="Arial" font-weight="bold" fill="#173c58">4. Hardware inventory</text><text x="550" y="461" text-anchor="middle" font-size="18" font-family="Arial" fill="#36576c">Check CPU, DIMMs, drives, NICs and controllers</text><path d="M550 482 v22" stroke="#2777aa" stroke-width="3"/><rect x="130" y="504" width="840" height="82" rx="14" fill="#e4f2ff" stroke="#aac5d8"/><text x="550" y="536" text-anchor="middle" font-size="23" font-family="Arial" font-weight="bold" fill="#173c58">5. Firmware baseline</text><text x="550" y="565" text-anchor="middle" font-size="18" font-family="Arial" fill="#36576c">Compare versions with approved catalog</text><path d="M550 586 v22" stroke="#2777aa" stroke-width="3"/><rect x="130" y="608" width="840" height="82" rx="14" fill="#e6f6ed" stroke="#aac5d8"/><text x="550" y="640" text-anchor="middle" font-size="23" font-family="Arial" font-weight="bold" fill="#173c58">6. Storage and boot settings</text><text x="550" y="669" text-anchor="middle" font-size="18" font-family="Arial" fill="#36576c">Confirm approved RAID/JBOD and boot mode</text><path d="M550 690 v22" stroke="#2777aa" stroke-width="3"/><rect x="130" y="712" width="840" height="82" rx="14" fill="#e4f2ff" stroke="#aac5d8"/><text x="550" y="744" text-anchor="middle" font-size="23" font-family="Arial" font-weight="bold" fill="#173c58">7. PXE / provisioning</text><text x="550" y="773" text-anchor="middle" font-size="18" font-family="Arial" fill="#36576c">Proceed with approved automated Linux deployment</text><path d="M550 794 v22" stroke="#2777aa" stroke-width="3"/><rect x="130" y="816" width="840" height="82" rx="14" fill="#e6f6ed" stroke="#aac5d8"/><text x="550" y="848" text-anchor="middle" font-size="23" font-family="Arial" font-weight="bold" fill="#173c58">8. Validation and handoff</text><text x="550" y="877" text-anchor="middle" font-size="18" font-family="Arial" fill="#36576c">Record results and escalate any failures</text></svg>