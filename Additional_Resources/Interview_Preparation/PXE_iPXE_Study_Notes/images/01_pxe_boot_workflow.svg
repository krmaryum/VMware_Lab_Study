<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="853" viewBox="0 0 1100 853"><rect width="100%" height="100%" fill="#f5f8fc"/><text x="550" y="49" text-anchor="middle" font-family="Arial" font-size="30" font-weight="bold" fill="#172a45">PXE / iPXE: Bare-Metal Linux Provisioning</text><text x="550" y="78" text-anchor="middle" font-family="Arial" font-size="16" fill="#5d7085">Illustrative training diagram</text><rect x="140" y="100" width="820" height="70" rx="13" fill="white" stroke="#c7d8e6" stroke-width="2"/><rect x="140" y="100" width="14" height="70" rx="5" fill="#1169ad"/><text x="175" y="127" font-family="Arial" font-size="22" font-weight="bold" fill="#172a45">1. Power ON</text><text x="175" y="152" font-family="Arial" font-size="17" fill="#41566c">Dell PowerEdge; POST and UEFI initialization</text><path d="M550 170 V188" stroke="#7189a0" stroke-width="3"/><path d="M543 182 L550 190 L557 182" fill="none" stroke="#7189a0" stroke-width="3"/><rect x="140" y="191" width="820" height="70" rx="13" fill="white" stroke="#c7d8e6" stroke-width="2"/><rect x="140" y="191" width="14" height="70" rx="5" fill="#117f70"/><text x="175" y="218" font-family="Arial" font-size="22" font-weight="bold" fill="#172a45">2. Select network boot</text><text x="175" y="243" font-family="Arial" font-size="17" fill="#41566c">Firmware chooses the approved PXE-capable NIC</text><path d="M550 261 V279" stroke="#7189a0" stroke-width="3"/><path d="M543 273 L550 281 L557 273" fill="none" stroke="#7189a0" stroke-width="3"/><rect x="140" y="282" width="820" height="70" rx="13" fill="white" stroke="#c7d8e6" stroke-width="2"/><rect x="140" y="282" width="14" height="70" rx="5" fill="#1169ad"/><text x="175" y="309" font-family="Arial" font-size="22" font-weight="bold" fill="#172a45">3. DHCP / boot discovery</text><text x="175" y="334" font-family="Arial" font-size="17" fill="#41566c">Receive network address and locate boot environment</text><path d="M550 352 V370" stroke="#7189a0" stroke-width="3"/><path d="M543 364 L550 372 L557 364" fill="none" stroke="#7189a0" stroke-width="3"/><rect x="140" y="373" width="820" height="70" rx="13" fill="white" stroke="#c7d8e6" stroke-width="2"/><rect x="140" y="373" width="14" height="70" rx="5" fill="#117f70"/><text x="175" y="400" font-family="Arial" font-size="22" font-weight="bold" fill="#172a45">4. Download network boot program</text><text x="175" y="425" font-family="Arial" font-size="17" fill="#41566c">TFTP, UEFI HTTP Boot, or iPXE chainloading as configured</text><path d="M550 443 V461" stroke="#7189a0" stroke-width="3"/><path d="M543 455 L550 463 L557 455" fill="none" stroke="#7189a0" stroke-width="3"/><rect x="140" y="464" width="820" height="70" rx="13" fill="white" stroke="#c7d8e6" stroke-width="2"/><rect x="140" y="464" width="14" height="70" rx="5" fill="#1169ad"/><text x="175" y="491" font-family="Arial" font-size="22" font-weight="bold" fill="#172a45">5. Load kernel and initramfs</text><text x="175" y="516" font-family="Arial" font-size="17" fill="#41566c">Network bootloader retrieves Linux boot components</text><path d="M550 534 V552" stroke="#7189a0" stroke-width="3"/><path d="M543 546 L550 554 L557 546" fill="none" stroke="#7189a0" stroke-width="3"/><rect x="140" y="555" width="820" height="70" rx="13" fill="white" stroke="#c7d8e6" stroke-width="2"/><rect x="140" y="555" width="14" height="70" rx="5" fill="#117f70"/><text x="175" y="582" font-family="Arial" font-size="22" font-weight="bold" fill="#172a45">6. Start installer</text><text x="175" y="607" font-family="Arial" font-size="17" fill="#41566c">Installer retrieves repository and Kickstart configuration</text><path d="M550 625 V643" stroke="#7189a0" stroke-width="3"/><path d="M543 637 L550 645 L557 637" fill="none" stroke="#7189a0" stroke-width="3"/><rect x="140" y="646" width="820" height="70" rx="13" fill="white" stroke="#c7d8e6" stroke-width="2"/><rect x="140" y="646" width="14" height="70" rx="5" fill="#1169ad"/><text x="175" y="673" font-family="Arial" font-size="22" font-weight="bold" fill="#172a45">7. Install operating system</text><text x="175" y="698" font-family="Arial" font-size="17" fill="#41566c">Disk setup, packages, networking, reboot</text><path d="M550 716 V734" stroke="#7189a0" stroke-width="3"/><path d="M543 728 L550 736 L557 728" fill="none" stroke="#7189a0" stroke-width="3"/><rect x="140" y="737" width="820" height="70" rx="13" fill="white" stroke="#c7d8e6" stroke-width="2"/><rect x="140" y="737" width="14" height="70" rx="5" fill="#117f70"/><text x="175" y="764" font-family="Arial" font-size="22" font-weight="bold" fill="#172a45">8. Validate and hand off</text><text x="175" y="789" font-family="Arial" font-size="17" fill="#41566c">Hardware, network, Puppet/configuration, inventory and evidence</text></svg>