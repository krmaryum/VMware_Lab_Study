<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#53738b"/></marker></defs>
<rect width="1200" height="760" fill="#f4f7fb"/>
<text x="50" y="60" font-family="sans-serif" font-size="30" font-weight="bold" fill="#142f48">A DNS lookup: responsibility and referrals</text>
<text x="50" y="96" font-family="sans-serif" font-size="19" fill="#496177">Example public lookup without a usable cached answer; local authoritative zones may answer directly.</text>
<path d="M330,230 L420,230" fill="none" stroke="#53738b" stroke-width="3" marker-end="url(#arrow)"/>

<path d="M740,210 L860,195" fill="none" stroke="#53738b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M1000,245 L1000,315" fill="none" stroke="#53738b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M1000,415 L1000,485" fill="none" stroke="#53738b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M860,550 L580,290" fill="none" stroke="#53738b" stroke-width="3" marker-end="url(#arrow)"/>

<rect x="50" y="170" width="280" height="120" rx="15" fill="white" stroke="#16867b" stroke-width="2"/>
<text x="68" y="204" font-family="sans-serif" font-size="22" font-weight="bold" fill="#142f48">Client</text>
<text x="68" y="235" font-family="sans-serif" font-size="16" fill="#496177">Application / OS resolver</text>
<text x="68" y="260" font-family="sans-serif" font-size="16" fill="#496177">Asks configured DNS server</text>
<rect x="420" y="170" width="320" height="120" rx="15" fill="white" stroke="#16867b" stroke-width="2"/>
<text x="438" y="204" font-family="sans-serif" font-size="22" font-weight="bold" fill="#142f48">Recursive resolver</text>
<text x="438" y="235" font-family="sans-serif" font-size="16" fill="#496177">Checks cache / local zones</text>
<text x="438" y="260" font-family="sans-serif" font-size="16" fill="#496177">May use a forwarder instead</text>
<rect x="860" y="145" width="280" height="100" rx="15" fill="white" stroke="#16867b" stroke-width="2"/>
<text x="878" y="179" font-family="sans-serif" font-size="22" font-weight="bold" fill="#142f48">Root DNS</text>
<text x="878" y="210" font-family="sans-serif" font-size="16" fill="#496177">Referral toward the TLD</text>
<rect x="860" y="315" width="280" height="100" rx="15" fill="white" stroke="#16867b" stroke-width="2"/>
<text x="878" y="349" font-family="sans-serif" font-size="22" font-weight="bold" fill="#142f48">TLD DNS</text>
<text x="878" y="380" font-family="sans-serif" font-size="16" fill="#496177">Referral toward authority</text>
<rect x="860" y="485" width="280" height="120" rx="15" fill="white" stroke="#16867b" stroke-width="2"/>
<text x="878" y="519" font-family="sans-serif" font-size="22" font-weight="bold" fill="#142f48">Authoritative DNS</text>
<text x="878" y="550" font-family="sans-serif" font-size="16" fill="#496177">Returns the requested record</text>
<text x="878" y="575" font-family="sans-serif" font-size="16" fill="#496177">Resolver returns it to client</text>
<text x="50" y="720" font-family="sans-serif" font-size="17" fill="#496177">Arrows simplify the exchanges. The client does not normally query root and TLD servers itself.</text></svg>