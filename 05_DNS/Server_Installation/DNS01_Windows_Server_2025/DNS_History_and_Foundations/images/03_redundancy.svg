<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#53738b"/></marker></defs>
<rect width="1200" height="760" fill="#f4f7fb"/>
<text x="50" y="60" font-family="sans-serif" font-size="30" font-weight="bold" fill="#142f48">Standalone DNS redundancy: on premises + cloud</text>
<text x="50" y="96" font-family="sans-serif" font-size="19" fill="#496177">Teacher enterprise design redrawn with unique names; illustrative, not deployed lab evidence.</text>
<path d="M360,215 L450,215" fill="none" stroke="#53738b" stroke-width="3" marker-end="url(#arrow)"/>

<path d="M360,265 L840,265" fill="none" stroke="#53738b" stroke-width="3" marker-end="url(#arrow)"/>

<path d="M360,450 L210,290" fill="none" stroke="#53738b" stroke-width="3" marker-end="url(#arrow)"/>

<path d="M500,450 L600,290" fill="none" stroke="#53738b" stroke-width="3" marker-end="url(#arrow)"/>

<rect x="60" y="160" width="300" height="130" rx="15" fill="white" stroke="#16867b" stroke-width="2"/>
<text x="78" y="194" font-family="sans-serif" font-size="22" font-weight="bold" fill="#142f48">DNS01 - Primary</text>
<text x="78" y="225" font-family="sans-serif" font-size="16" fill="#496177">On-premises server</text>
<text x="78" y="250" font-family="sans-serif" font-size="16" fill="#496177">Writable standard zone</text>
<rect x="450" y="160" width="300" height="130" rx="15" fill="white" stroke="#16867b" stroke-width="2"/>
<text x="468" y="194" font-family="sans-serif" font-size="22" font-weight="bold" fill="#142f48">DNS02 - Secondary</text>
<text x="468" y="225" font-family="sans-serif" font-size="16" fill="#496177">VM on ESXi01</text>
<text x="468" y="250" font-family="sans-serif" font-size="16" fill="#496177">Read-only zone copy</text>
<rect x="840" y="160" width="300" height="130" rx="15" fill="white" stroke="#16867b" stroke-width="2"/>
<text x="858" y="194" font-family="sans-serif" font-size="22" font-weight="bold" fill="#142f48">DNS03 - Secondary</text>
<text x="858" y="225" font-family="sans-serif" font-size="16" fill="#496177">Cloud VM example</text>
<text x="858" y="250" font-family="sans-serif" font-size="16" fill="#496177">Read-only zone copy</text>
<rect x="180" y="450" width="360" height="140" rx="15" fill="white" stroke="#16867b" stroke-width="2"/>
<text x="198" y="484" font-family="sans-serif" font-size="22" font-weight="bold" fill="#142f48">Configured clients</text>
<text x="198" y="515" font-family="sans-serif" font-size="16" fill="#496177">Need a reachable DNS server</text>
<text x="198" y="540" font-family="sans-serif" font-size="16" fill="#496177">and correct resolver settings</text>
<rect x="690" y="450" width="400" height="140" rx="15" fill="white" stroke="#16867b" stroke-width="2"/>
<text x="708" y="484" font-family="sans-serif" font-size="22" font-weight="bold" fill="#142f48">Separate failure domains</text>
<text x="708" y="515" font-family="sans-serif" font-size="16" fill="#496177">Hosts, switch, power, site, link</text>
<text x="708" y="540" font-family="sans-serif" font-size="16" fill="#496177">Cloud reachability is essential</text>
<text x="50" y="720" font-family="sans-serif" font-size="17" fill="#496177">DNS availability does not restore a failed application. Cloud DNS is not automatically reachable or a full DR solution.</text></svg>