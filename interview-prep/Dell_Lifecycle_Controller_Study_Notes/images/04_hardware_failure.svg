<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640"><rect width="100%" height="100%" fill="#f6f9fc"/><text x="550" y="58" text-anchor="middle" font-size="34" font-family="Arial" font-weight="bold" fill="#123047">Hardware Error Troubleshooting</text><rect x="130" y="88" width="840" height="82" rx="14" fill="#e4f2ff" stroke="#aac5d8"/><text x="550" y="120" text-anchor="middle" font-size="23" font-family="Arial" font-weight="bold" fill="#173c58">Read iDRAC health and Lifecycle Log</text><text x="550" y="149" text-anchor="middle" font-size="18" font-family="Arial" fill="#36576c">Record exact errors and hardware identifiers</text><path d="M550 170 v22" stroke="#2777aa" stroke-width="3"/><rect x="130" y="192" width="840" height="82" rx="14" fill="#e6f6ed" stroke="#aac5d8"/><text x="550" y="224" text-anchor="middle" font-size="23" font-family="Arial" font-weight="bold" fill="#173c58">Run approved diagnostics</text><text x="550" y="253" text-anchor="middle" font-size="18" font-family="Arial" fill="#36576c">Identify DIMM, disk, fan, PSU or controller fault</text><path d="M550 274 v22" stroke="#2777aa" stroke-width="3"/><rect x="130" y="296" width="840" height="82" rx="14" fill="#e4f2ff" stroke="#aac5d8"/><text x="550" y="328" text-anchor="middle" font-size="23" font-family="Arial" font-weight="bold" fill="#173c58">Follow runbook</text><text x="550" y="357" text-anchor="middle" font-size="18" font-family="Arial" fill="#36576c">Avoid unauthorized firmware or storage changes</text><path d="M550 378 v22" stroke="#2777aa" stroke-width="3"/><rect x="130" y="400" width="840" height="82" rx="14" fill="#e6f6ed" stroke="#aac5d8"/><text x="550" y="432" text-anchor="middle" font-size="23" font-family="Arial" font-weight="bold" fill="#173c58">Escalate / RMA when required</text><text x="550" y="461" text-anchor="middle" font-size="18" font-family="Arial" fill="#36576c">Provide logs, slot IDs and inventory details</text><path d="M550 482 v22" stroke="#2777aa" stroke-width="3"/><rect x="130" y="504" width="840" height="82" rx="14" fill="#e4f2ff" stroke="#aac5d8"/><text x="550" y="536" text-anchor="middle" font-size="23" font-family="Arial" font-weight="bold" fill="#173c58">Retest and document</text><text x="550" y="565" text-anchor="middle" font-size="18" font-family="Arial" fill="#36576c">Confirm healthy status before handoff</text></svg>