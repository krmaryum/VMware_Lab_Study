<svg xmlns="http://www.w3.org/2000/svg" width="980" height="665" viewBox="0 0 980 665"><rect width="100%" height="100%" fill="#f7fafc"/><text x="490" y="52" text-anchor="middle" font-family="Arial" font-size="30" font-weight="bold" fill="#15324f">DHCP Relay Across Subnets</text><rect x="155" y="80" width="670" height="69" rx="12" fill="#dcecf9" stroke="#7c9db4"/><text x="490" y="107" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#12344d">New Server</text><text x="490" y="132" text-anchor="middle" font-family="Arial" font-size="15" fill="#345269">DHCP client on provisioning VLAN</text><path d="M490 149 v24 m-8 -9 l8 9 l8 -9" fill="none" stroke="#326d9a" stroke-width="3"/><rect x="155" y="176" width="670" height="69" rx="12" fill="#e0f5ea" stroke="#7c9db4"/><text x="490" y="203" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#12344d">Switch / Layer 3 Gateway</text><text x="490" y="228" text-anchor="middle" font-family="Arial" font-size="15" fill="#345269">Client broadcasts reach local VLAN</text><path d="M490 245 v24 m-8 -9 l8 9 l8 -9" fill="none" stroke="#326d9a" stroke-width="3"/><rect x="155" y="272" width="670" height="69" rx="12" fill="#dcecf9" stroke="#7c9db4"/><text x="490" y="299" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#12344d">DHCP Relay Agent</text><text x="490" y="324" text-anchor="middle" font-family="Arial" font-size="15" fill="#345269">Forwards DHCP messages to remote server</text><path d="M490 341 v24 m-8 -9 l8 9 l8 -9" fill="none" stroke="#326d9a" stroke-width="3"/><rect x="155" y="368" width="670" height="69" rx="12" fill="#e0f5ea" stroke="#7c9db4"/><text x="490" y="395" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#12344d">DHCP Server</text><text x="490" y="420" text-anchor="middle" font-family="Arial" font-size="15" fill="#345269">Example: 192.168.50.10</text><path d="M490 437 v24 m-8 -9 l8 9 l8 -9" fill=