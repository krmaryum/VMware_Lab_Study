<svg xmlns="http://www.w3.org/2000/svg" width="980" height="473" viewBox="0 0 980 473"><rect width="100%" height="100%" fill="#f7fafc"/><text x="490" y="52" text-anchor="middle" font-family="Arial" font-size="30" font-weight="bold" fill="#15324f">Example Network Segmentation</text><rect x="155" y="80" width="670" height="69" rx="12" fill="#dcecf9" stroke="#7c9db4"/><text x="490" y="107" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#12344d">VLAN 10 — Management</text><text x="490" y="132" text-anchor="middle" font-family="Arial" font-size="15" fill="#345269">BMC / iDRAC — example 10.10.10.0/24</text><path d="M490 149 v24 m-8 -9 l8 9 l8 -9" fill="none" stroke="#326d9a" stroke-width="3"/><rect x="155" y="176" width="670" height="69" rx="12" fill="#e0f5ea" stroke="#7c9db4"/><text x="490" y="203" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#12344d">VLAN 100 — Provisioning</text><text x="490" y="228" text-anchor="middle" font-family="Arial" font-size="15" fill="#345269">DHCP / PXE — example 192.168.10.0/24</text><path d="M490 245 v24 m-8 -9 l8 9 l8 -9" fill="none" stroke="#326d9a" stroke-width="3"/><rect x="155" y="272" width="670" height="69" rx="12" fill="#dcecf9" stroke="#7c9db4"/><text x="490" y="299" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#12344d">VLAN 200 — Production</text><text x="490" y="324" text-anchor="middle" font-family="Arial" font-size="15" fill="#345269">Workloads — example 172.16.20.0/24</text><text x="490" y="450" text-anchor="middle" font-family="Arial" font-size="14" fill="#536a7b">VLAN IDs and IP subnets are examples, not Vultr configuration</text></svg>