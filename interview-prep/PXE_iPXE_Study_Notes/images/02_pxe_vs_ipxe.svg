<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580"><rect width="100%" height="100%" fill="#f5f8fc"/><text x="550" y="49" text-anchor="middle" font-family="Arial" font-size="30" font-weight="bold" fill="#172a45">Traditional PXE vs iPXE</text><text x="550" y="78" text-anchor="middle" font-family="Arial" font-size="16" fill="#5d7085">Not every PXE environment uses TFTP; UEFI HTTP Boot is a separate option</text><rect x="140" y="100" width="820" height="70" rx="13" fill="white" stroke="#c7d8e6" stroke-width="2"/><rect x="140" y="100" width="14" height="70" rx="5" fill="#1169ad"/><text x="175" y="127" font-family="Arial" font-size="22" font-weight="bold" fill="#172a45">Traditional PXE</text><text x="175" y="152" font-family="Arial" font-size="17" fill="#41566c">Firmware-based network boot; commonly DHCP + TFTP</text><path d="M550 170 V188" stroke="#7189a0" stroke-width="3"/><path d="M543 182 L550 190 L557 182" fill="none" stroke="#7189a0" stroke-width="3"/><rect x="140" y="191" width="820" height="70" rx="13" fill="white" stroke="#c7d8e6" stroke-width="2"/><rect x="140" y="191" width="14" height="70" rx="5" fill="#117f70"/><text x="175" y="218" font-family="Arial" font-size="22" font-weight="bold" fill="#172a45">PXE boot program</text><text x="175" y="243" font-family="Arial" font-size="17" fill="#41566c">Retrieves a compatible network boot program</text><path d="M550 261 V279" stroke="#7189a0" stroke-width="3"/><path d="M543 273 L550 281 L557 273" fill="none" stroke="#7189a0" stroke-width="3"/><rect x="140" y="282" width="820" height="70" rx="13" fill="white" stroke="#c7d8e6" stroke-width="2"/><rect x="140" y="282" width="14" height="70" rx="5" fill="#1169ad"/><text x="175" y="309" font-family="Arial" font-size="22" font-weight="bold" fill="#172a45">iPXE enhancement</text><text x="175" y="334" font-family="Arial" font-size="17" fill="#41566c">Scripting, HTTP/HTTPS and flexible boot menus</text><path d="M550 352 V370" stroke="#7189a0" stroke-width="3"/><path d="M543 364 L550 372 L557 364" fill="none" stroke="#7189a0" stroke-width="3"/><rect x="140" y="373" width="820" height="70" rx="13" fill="white" stroke="#c7d8e6" stroke-width="2"/><rect x="140" y="373" width="14" height="70" rx="5" fill="#117f70"/><text x="175" y="400" font-family="Arial" font-size="22" font-weight="bold" fill="#172a45">iPXE script</text><text x="175" y="425" font-family="Arial" font-size="17" fill="#41566c">Fetch kernel, initramfs and installer parameters via HTTP</text><path d="M550 443 V461" stroke="#7189a0" stroke-width="3"/><path d="M543 455 L550 463 L557 455" fill="none" stroke="#7189a0" stroke-width="3"/><rect x="140" y="464" width="820" height="70" rx="13" fill="white" stroke="#c7d8e6" stroke-width="2"/><rect x="140" y="464" width="14" height="70" rx="5" fill="#1169ad"/><text x="175" y="491" font-family="Arial" font-size="22" font-weight="bold" fill="#172a45">Common goal</text><text x="175" y="516" font-family="Arial" font-size="17" fill="#41566c">Boot an OS installer without a preinstalled local OS</text></svg>